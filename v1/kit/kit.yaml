# =============================================================================
# devbox — deklarative Kit-Variante (Kür, siehe Tutorial Kapitel 7)
#
# ⚠️  EXPERIMENTELL. `sbx kit --help` sagt wörtlich:
#     "EXPERIMENTAL: this command may change or be removed in future releases."
#
#     Deshalb ist DIES NICHT der Hauptweg von devbox. Der stabile Weg ist
#     v1/devbox.sh — dieses Kit zeigt nur, wie dieselbe Konfiguration
#     aussähe, wenn man sie deklarieren statt skripten würde.
#
# Ausprobieren:
#     sbx create --kit ./v1/kit/ --name devbox-kit claude ~/dev/own
#
# Was ein Kit NICHT abnimmt: die Workspaces. Die stehen weiterhin hinter dem
# Agent-Namen auf der Kommandozeile.
# =============================================================================

schemaVersion: "2"
kind: sandbox

name: devbox
displayName: devbox — Claude-Sandbox für mehrere Projekte
description: >-
  Python 3.10/3.12/3.14, Node 24, pnpm, uv, poetry, ruff, Playwright und
  Safe Chain. Deklarative Variante zu v1/devbox.sh.

sandbox:
  # Das Template, das wir in Kapitel 3 gebaut und mit `sbx template load`
  # registriert haben.
  image: "devbox/base:latest"
  entrypoint: [claude]

# Entspricht der Schleife über BASE_HOSTS in devbox.sh.
# Im Kit-Format wird der Port mit angegeben.
permissions:
  network:
    allow:
      - "api.anthropic.com:443"       # Claude selbst
      - "*.claude.ai:443"             # Login und Connectors
      - "github.com:443"              # git clone / push
      - "*.githubusercontent.com:443" # Rohdateien von GitHub
      - "*.npmjs.org:443"             # npm / pnpm
      - "pypi.org:443"                # pip / uv / poetry
      - "files.pythonhosted.org:443"  # die eigentlichen Python-Pakete
      - "*.astral.sh:443"             # uv und Python-Interpreter
      - "*.aikido.dev:443"            # Safe-Chain-Prüfungen

# Anweisungen, die der Agent beim Start liest.
agentInstructions:
  filename: CLAUDE.md
