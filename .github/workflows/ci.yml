# =============================================================================
# CI — die kleinen Prüfungen, die Drift in diesem Repo verhindern
#
# Was hier NICHT passiert: das Image bauen. Das sind rund 6 GB und mehrere
# Minuten pro Lauf, und ein Fehler im Dockerfile fällt beim ersten lokalen
# `./devbox/devbox.sh build` sowieso auf. Die CI prüft das, was leise kaputt
# geht: Shell-Fehler und Links, die ins Leere zeigen.
#
# Alles hier läuft auch lokal:
#   shellcheck devbox/devbox.sh scripts/check-links.sh
#   ./scripts/check-links.sh
#   bash -n devbox/devbox.conf.example
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Kein Schritt in diesem Workflow schreibt ins Repo, also braucht
# der Token auch keine Schreibrechte — GitHub gäbe sie sonst großzügig mit.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout ist von GitHub selbst. In einem Repo, das über
      # Lieferketten redet, wäre der konsequente Schritt, statt "@v4" den
      # Commit-Hash festzunageln — ein Tag lässt sich verschieben, ein Hash
      # nicht. Den passenden Hash findest du mit:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@v4

      # shellcheck ist auf den ubuntu-Runnern vorinstalliert.
      #
      # Die Hooks von v3 gehören mit hinein, obwohl sie klein sind: notify.sh
      # läuft IM Container als Hook, und ein Fehler darin fällt dort nicht als
      # Skriptfehler auf, sondern als "die Benachrichtigung kommt nicht".
      # watch.sh läuft auf dem Host und trägt die Vertrauensgrenze zwischen
      # Sandbox und Mac.
      - name: Shell-Skripte prüfen
        run: |
          shellcheck devbox/devbox.sh solobox/solobox.sh scripts/check-links.sh
          shellcheck v3/sbx-claude.sh v3/hooks/notify.sh v3/hooks/watch.sh

      # Die Profilvorlage wird von devbox.sh per `source` gelesen. Ein
      # Syntaxfehler darin würde also erst beim Start auffallen — und dort wie
      # ein Fehler des Wrappers aussehen. Für solobox.conf.example gilt das
      # genauso — dort sogar mit dem Zusatz, dass die Datei optional ist und ein
      # Fehler darin deshalb noch später auffiele.
      - name: Konfigurationsvorlagen sind gültiges Bash
        run: |
          bash -n devbox/devbox.conf.example
          bash -n solobox/solobox.conf.example
          bash -n v3/sbx-claude.conf.example

      # Alle Wrapper werden über einen Symlink bzw. direkt aufgerufen — ohne
      # Ausführbar-Bit scheitert das mit "permission denied", und zwar erst beim
      # Nutzer.
      #
      # Bei v3 gilt das auch für watch.sh: der LaunchAgent startet die Datei
      # direkt, und ohne Bit meldet launchd nur "läuft nicht" — ohne zu sagen,
      # warum. notify.sh setzt das Dockerfile ohnehin per `chmod a+rx`, es
      # braucht das Bit im Repo also nicht.
      - name: Wrapper sind ausführbar
        run: |
          test -x devbox/devbox.sh
          test -x solobox/solobox.sh
          test -x v3/sbx-claude.sh
          test -x v3/hooks/watch.sh

      - name: Links in der Doku prüfen
        run: ./scripts/check-links.sh
