# =============================================================================
# CI — die kleinen Prüfungen, die Drift in diesem Repo verhindern
#
# Was hier NICHT passiert: das Image bauen. Das sind rund 6 GB und mehrere
# Minuten pro Lauf, und ein Fehler im Dockerfile fällt beim ersten lokalen
# `./devbox/devbox.sh build` sowieso auf. Die CI prüft das, was leise kaputt
# geht: Shell-Fehler und Links, die ins Leere zeigen.
#
# Alles hier läuft auch lokal:
#   shellcheck devbox/devbox.sh scripts/check-links.sh
#   ./scripts/check-links.sh
#   bash -n devbox/devbox.conf.example
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen. Kein Schritt in diesem Workflow schreibt ins Repo, also braucht
# der Token auch keine Schreibrechte — GitHub gäbe sie sonst großzügig mit.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout ist von GitHub selbst. In einem Repo, das über
      # Lieferketten redet, wäre der konsequente Schritt, statt "@v4" den
      # Commit-Hash festzunageln — ein Tag lässt sich verschieben, ein Hash
      # nicht. Den passenden Hash findest du mit:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
      - uses: actions/checkout@v4

      # shellcheck ist auf den ubuntu-Runnern vorinstalliert.
      - name: Shell-Skripte prüfen
        run: shellcheck devbox/devbox.sh scripts/check-links.sh

      # Die Profilvorlage wird von devbox.sh per `source` gelesen. Ein
      # Syntaxfehler darin würde also erst beim Start auffallen — und dort wie
      # ein Fehler des Wrappers aussehen.
      - name: Profilvorlage ist gültiges Bash
        run: bash -n devbox/devbox.conf.example

      - name: Links in der Doku prüfen
        run: ./scripts/check-links.sh
